name: relay-dev

# Dev bench: sshpiperd in registry mode in front of two Ubuntu 24.04 sshd.
# The 10.99.0.x addresses are not reachable from a Windows/macOS host:
# run every test from the tester container (see test.sh).

networks:
  relaynet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.0.0/24
          # keep dynamic allocation away from the static addresses below
          ip_range: 10.99.0.192/26

volumes:
  proxy-hostkey:
  proxy-audit:
  proxy-registry:
  backend1-hostkeys:
  backend2-hostkeys:
  backend3-hostkeys:

services:
  proxy:
    build:
      context: ..
      dockerfile: relay-dev/proxy/Dockerfile
    hostname: proxy
    cap_add: [NET_ADMIN]
    environment:
      # extra "external" addresses added to eth0 by the entrypoint
      EXTERNAL_IPS: 10.99.0.11,10.99.0.12
      SSHPIPERD_PORT: "22"
      SSHPIPERD_REGISTRY: /data/relay-registry.db
      # the tester may reach entries that are ready but not yet exposed
      SSHPIPERD_REGISTRY_VERIFY_FROM: 127.0.0.1,::1,10.99.0.100
      SSHPIPERD_LOG_LEVEL: ${SSHPIPERD_LOG_LEVEL:-info}
      SSHPIPERD_PRESERVE_SOURCE_PORT: "true"
      SSHPIPERD_COPY_CLIENT_VERSION: "true"
    command:
      - --audit-dir=/audit
      - --sensor-name=relay-dev
      - /sshpiperd/plugins/relay
    volumes:
      - proxy-registry:/data
      - proxy-audit:/audit
      # backend host keys are written here by seed.sh
      - backend1-hostkeys:/keys/backend1
      - backend2-hostkeys:/keys/backend2
      - backend3-hostkeys:/keys/backend3
    networks:
      relaynet:
        ipv4_address: 10.99.0.2
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/10.99.0.11/22"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy

  backend1:
    build: ./backend
    hostname: backend1
    env_file: ./secrets/backend1.env
    volumes:
      - backend1-hostkeys:/hostkeys
    networks:
      relaynet:
        ipv4_address: 10.99.0.21
    healthcheck: &sshd-health
      test: ["CMD-SHELL", "pgrep -x sshd >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30

  backend2:
    build: ./backend
    hostname: backend2
    env_file: ./secrets/backend2.env
    volumes:
      - backend2-hostkeys:/hostkeys
    networks:
      relaynet:
        ipv4_address: 10.99.0.22
    healthcheck: *sshd-health

  backend3:
    build: ./backend
    hostname: backend3
    env_file: ./secrets/backend3.env
    volumes:
      - backend3-hostkeys:/hostkeys
    networks:
      relaynet:
        ipv4_address: 10.99.0.23
    healthcheck: *sshd-health

  admind:
    build:
      context: ..
      dockerfile: relay-dev/admind/Dockerfile
    hostname: admind
    environment:
      RELAY_ADMIN_TOKEN: ${RELAY_ADMIN_TOKEN:-bench-token}
    command:
      - --registry=/data/relay-registry.db
      - --address=0.0.0.0:8090
      - --audit-dir=/audit
      - --insecure
    volumes:
      - proxy-registry:/data
      - proxy-audit:/audit:ro
    networks:
      relaynet:
        ipv4_address: 10.99.0.3
    depends_on:
      proxy:
        condition: service_healthy

  tester:
    build:
      context: ..
      dockerfile: relay-dev/tester/Dockerfile
    hostname: tester
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      SSHPIPERD_REGISTRY: /data/relay-registry.db
    volumes:
      # registryctl verify-front reads the personas (the proxy only allows
      # this source for entries that are ready)
      - proxy-registry:/data
    networks:
      relaynet:
        ipv4_address: 10.99.0.100
    depends_on:
      - proxy
